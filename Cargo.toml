[package]
name = "misy"
version = "0.1.0"
edition = "2024"

[dependencies]
atomicwrites = "0.4.4"
command-group = "5.0.1"
jsonschema = { version = "0.49.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
toml = "1"

[dev-dependencies]
tempfile = "3"
